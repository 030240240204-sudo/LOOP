<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOP System - Hệ Sinh Thái Tuần Hoàn Green Tech</title>

  <style>
    :root {
      --bg-color: #0b2a1c;
      --card-bg: #123d2b;
      --card-hover: #19523a;
      --primary-color: #35f3a3;
      --primary-hover: #20c785;
      --text-color: #ffffff;
      --text-muted: #a3c7b8;
      --danger-color: #ff6b6b;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #071c13 0%, var(--bg-color) 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(18, 61, 43, 0.6);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(53, 243, 163, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 2.2rem;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(53, 243, 163, 0.3);
    }

    h3, h4 {
      margin-top: 0;
      color: var(--primary-color);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      margin: 20px 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      background: rgba(7, 28, 19, 0.6);
      border: 1px solid rgba(53, 243, 163, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 8px rgba(53, 243, 163, 0.4);
      background: rgba(7, 28, 19, 0.9);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: var(--primary-color);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      color: #05140d;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(53, 243, 163, 0.2);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(53, 243, 163, 0.3);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      box-shadow: none;
    }

    .btn-logout:hover {
      background: var(--danger-color);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.2);
    }

    .hidden {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 12px;
      background: rgba(7, 28, 19, 0.5);
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      margin-top: 0;
      background: transparent;
      color: var(--text-muted);
      box-shadow: none;
      font-weight: 500;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      transform: none;
      box-shadow: none;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #05140d;
      font-weight: bold;
    }

    .badge {
      background: rgba(53, 243, 163, 0.15);
      color: var(--primary-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-top: 5px;
      border: 1px solid rgba(53, 243, 163, 0.3);
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .grid .card {
      margin: 0;
      background: rgba(7, 28, 19, 0.4);
    }

    .info-text {
      font-size: 14px;
      color: var(--text-muted);
      margin: 5px 0;
    }

    .info-highlight {
      font-size: 18px;
      font-weight: bold;
      color: white;
    }

    /* Sub-box payment animation */
    #paymentBox {
      background: rgba(53, 243, 163, 0.05);
      border-left: 4px solid var(--primary-color);
      padding: 15px;
      border-radius: 4px 12px 12px 4px;
      margin-top: 15px;
    }

    /* Phân quyền UI CSS */
    .role-section {
      border-top: 1px dashed rgba(253, 243, 163, 0.2);
      margin-top: 15px;
      padding-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>🌿 LOOP SYSTEM</h1>

  <!-- NAV TABS -->
  <div id="navTabs" class="tabs">
    <button class="tab-btn active" onclick="showTab('login')">Đăng nhập</button>
    <button class="tab-btn" onclick="showTab('register')">Đăng ký</button>
  </div>

  <!-- LOGIN BOX -->
  <div id="loginBox" class="card">
    <h3>Mừng bạn quay trở lại</h3>
    
    <div class="input-group">
      <input id="loginEmail" type="email" placeholder="Nhập Gmail của bạn">
    </div>
    <div class="input-group">
      <input id="loginName" type="text" placeholder="Nhập Họ và tên">
    </div>
    <div class="input-group">
      <input id="loginPassword" type="password" placeholder="Nhập Mật khẩu">
    </div>
    <div class="input-group">
      <select id="loginRole">
        <option value="">-- Chọn Chức năng hệ thống --</option>
        <option value="org">Tổ chức Doanh nghiệp</option>
        <option value="recycle">Hệ thống thu gom tái chế</option>
        <option value="user">Người dùng cá nhân</option>
      </select>
    </div>

    <button onclick="login()">Xác nhận Đăng nhập</button>
  </div>

  <!-- REGISTER BOX -->
  <div id="registerBox" class="card hidden">
    <h3>Tạo tài khoản mới</h3>

    <div class="input-group">
      <input id="regEmail" type="email" placeholder="Địa chỉ Gmail">
    </div>
    <div class="input-group">
      <input id="regPhone" type="tel" placeholder="Số điện thoại liên hệ">
    </div>
    <div class="input-group">
      <input id="regName" type="text" placeholder="Họ và tên của bạn hoặc Tổ chức">
    </div>
    <div class="input-group">
      <select id="regRole" onchange="handleRoleChange()">
        <option value="">-- Chọn vai trò tham gia --</option>
        <option value="org">Tổ chức Doanh nghiệp</option>
        <option value="recycle">Hệ thống thu gom tái chế</option>
        <option value="user">Người dùng cá nhân</option>
      </select>
    </div>
    <div class="input-group">
      <input id="regPassword" type="password" placeholder="Thiết lập mật khẩu">
    </div>
    <div class="input-group">
      <input id="regRePassword" type="password" placeholder="Nhập lại mật khẩu để kiểm tra">
    </div>

    <!-- PAYMENT SUB-BOX -->
    <div id="paymentBox" class="hidden">
      <h4>💰 Phí duy trì nền tảng xanh</h4>
      <p class="info-text" style="margin-bottom: 10px;">Đối với Tổ chức/Hệ thống tái chế, vui lòng chọn gói phí:</p>
      <select id="paymentPlan">
        <option value="300k">Gói Chuẩn: 300.000 VNĐ / 1 năm</option>
        <option value="50k">Gói Trải nghiệm: 50.000 VNĐ / 1 tháng</option>
      </select>
    </div>

    <button onclick="register()">Hoàn tất Đăng ký</button>
  </div>

  <!-- DASHBOARD BOX -->
  <div id="dashboard" class="card hidden">
    <h3>Xin chào, <span id="txtDashboardUser" style="color: white;">-</span> 👋</h3>
    <span class="badge" id="txtDashboardRole">-</span>

    <!-- Kpi thống kê tổng quan -->
    <div class="grid">
      <div class="card">
        <h4>📊 Hệ thống (Tổng)</h4>
        <p class="info-text">Thành viên: <span id="totalUsers" class="info-highlight">0</span></p>
        <p class="info-text">Doanh nghiệp: <span id="totalOrg" class="info-highlight">0</span></p>
      </div>

      <div class="card">
        <h4>♻️ Chỉ số Xanh</h4>
        <p class="info-text">Đã xử lý: <span id="waste" class="info-highlight">120</span> kg rác</p>
      </div>
    </div>

    <!-- KHÔNG GIAN TÍNH NĂNG THEO PHÂN QUYỀN TRUY CẬP (Được cập nhật tự động bằng JS) -->
    <div id="roleFeatureSection" class="role-section">
       <!-- Nội dung động xuất hiện ở đây -->
    </div>

    <button class="btn-logout" onclick="logout()">Đăng xuất khỏi hệ thống</button>
  </div>

</div>

<script>
// Khởi tạo cơ sở dữ liệu giả lập ban đầu trong LocalStorage nếu trống
let users = JSON.parse(localStorage.getItem("users"));
if (!users || users.length === 0) {
  users = [
    { email: "user@gmail.com", phone: "0901234567", name: "Nguyễn Văn A", role: "user", pass: "123" },
    { email: "org@gmail.com", phone: "0907654321", name: "Green Lifestyle Group", role: "org", pass: "123" },
    { email: "recycle@gmail.com", phone: "0909999888", name: "Trạm Tái Chế Xanh Q1", role: "recycle", pass: "123" }
  ];
  localStorage.setItem("users", JSON.stringify(users));
}

let currentUser = null;
let currentWasteKgs = parseInt(localStorage.getItem("currentWasteKgs")) || 120;
document.getElementById("waste").innerText = currentWasteKgs;

// CHUYỂN ĐỔI TAB TƯƠNG TÁC
function showTab(tab) {
  const loginBox = document.getElementById("loginBox");
  const registerBox = document.getElementById("registerBox");
  const tabBtns = document.querySelectorAll(".tab-btn");

  if (tab === "login") {
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
    tabBtns[0].classList.add("active");
    tabBtns[1].classList.remove("active");
  } else {
    loginBox.classList.add("hidden");
    registerBox.classList.remove("hidden");
    tabBtns[0].classList.remove("active");
    tabBtns[1].classList.add("active");
  }
}

// THEO DÕI VAI TRÒ ĐỂ BẬT NÚT ĐÓNG PHÍ
function handleRoleChange() {
  const role = document.getElementById("regRole").value;
  const paymentBox = document.getElementById("paymentBox");
  
  if (role === "org" || role === "recycle") {
    paymentBox.classList.remove("hidden");
  } else {
    paymentBox.classList.add("hidden");
  }
}

// XỬ LÝ ĐĂNG KÝ
function register() {
  const email = document.getElementById("regEmail").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const name = document.getElementById("regName").value.trim();
  const role = document.getElementById("regRole").value;
  const pass = document.getElementById("regPassword").value;
  const rePass = document.getElementById("regRePassword").value;

  if (!email || !name || !pass || !role) {
    alert("Vui lòng điền đầy đủ các thông tin bắt buộc (*)");
    return;
  }

  if (pass !== rePass) {
    alert("Mật khẩu nhập lại chưa trùng khớp. Hãy kiểm tra lại!");
    return;
  }

  // Check trùng email
  if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
    alert("Email này đã được đăng ký trên hệ thống LOOP.");
    return;
  }

  if (role === "org" || role === "recycle") {
    const plan = document.getElementById("paymentPlan").value;
    alert(`💳 Hệ thống ghi nhận cổng thanh toán: Đã kích hoạt gói phí ${plan === '300k' ? '300.000đ/Năm' : '50.000đ/Tháng'}!`);
  }

  const newUser = { email, phone, name, role, pass };
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  alert("🎉 Đăng ký tài khoản LOOP thành công! Tiến hành đăng nhập nào.");
  
  // Clear form đăng ký
  document.getElementById("regEmail").value = "";
  document.getElementById("regPhone").value = "";
  document.getElementById("regName").value = "";
  document.getElementById("regRole").value = "";
  document.getElementById("regPassword").value = "";
  document.getElementById("regRePassword").value = "";
  document.getElementById("paymentBox").classList.add("hidden");
  
  showTab("login");
}

// XỬ LÝ ĐĂNG NHẬP
function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPassword").value;
  const role = document.getElementById("loginRole").value;

  if (!email || !name || !pass || !role) {
    alert("Vui lòng nhập đầy đủ 4 thông tin xác thực.");
    return;
  }

  const userMatch = users.find(u =>
    u.email.toLowerCase() === email.toLowerCase() &&
    u.name === name &&
    u.pass === pass &&
    u.role === role
  );

  if (!userMatch) {
    alert("Không tìm thấy người dùng phù hợp. Vui lòng kiểm tra kỹ Họ tên, Email, Mật khẩu và Chức năng chọn lựa!");
    return;
  }

  currentUser = userMatch;

  // Ẩn form điều hướng và Đăng nhập, mở Dashboard
  document.getElementById("navTabs").classList.add("hidden");
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  // Hiển thị thông tin hồ sơ
  document.getElementById("txtDashboardUser").innerText = currentUser.name;
  
  let roleVietnamese = "Thành viên";
  if(currentUser.role === "org") roleVietnamese = "Tổ chức / Doanh nghiệp";
  if(currentUser.role === "recycle") roleVietnamese = "Hệ thống tái chế";
  document.getElementById("txtDashboardRole").innerText = roleVietnamese;

  updateKPI();
  renderRoleFeatures();
}

// CẬP NHẬT CHỈ SỐ KPI TỔNG
function updateKPI() {
  document.getElementById("totalUsers").innerText = users.length;
  document.getElementById("totalOrg").innerText = users.filter(u => u.role === "org").length;
  document.getElementById("waste").innerText = currentWasteKgs;
}

// HIỂN THỊ CHỨC NĂNG RIÊNG THEO PHÂN QUYỀN
function renderRoleFeatures() {
  const container = document.getElementById("roleFeatureSection");
  
  if (currentUser.role === "user") {
    container.innerHTML = `
      <h4>🎁 Đặc quyền Cá nhân xanh</h4>
      <p class="info-text">Tích cực gom rác thải phân loại tại nhà để đổi lấy voucher quà tặng giá trị.</p>
      <button style="background: #35a3f3; color: white;" onclick="simulateAction('user')">✨ Đổi rác tích 50 điểm</button>
    `;
  } else if (currentUser.role === "org") {
    container.innerHTML = `
      <h4>🏢 Bảng điều khiển Doanh Nghiệp</h4>
      <p class="info-text">Quản lý và tài trợ các chiến dịch thu gom bảo vệ môi trường.</p>
      <button style="background: #e67e22; color: white;" onclick="simulateAction('org')">📢 Phát động chiến dịch mới</button>
    `;
  } else if (currentUser.role === "recycle") {
    container.innerHTML = `
      <h4>🏭 Quản lý Trạm thu gom & Tái chế</h4>
      <p class="info-text">Xác nhận xử lý khối lượng rác được vận chuyển đến kho.</p>
      <button style="background: #9b59b6; color: white;" onclick="simulateAction('recycle')">⚡ Xác nhận đã xử lý +15kg rác</button>
    `;
  }
}

// GIẢ LẬP HÀNH ĐỘNG ĐẶC QUYỀN
function simulateAction(role) {
  if (role === 'user') {
    alert("🎉 Đã tích thêm 50 điểm LOOP thành công! Bạn có thể dùng điểm đổi quà ở giai đoạn tiếp theo.");
  } else if (role === 'org') {
    alert("📢 Phát động chiến dịch thành công! Yêu cầu của bạn đã gửi đến ban kiểm duyệt của hệ thống.");
  } else if (role === 'recycle') {
    currentWasteKgs += 15;
    localStorage.setItem("currentWasteKgs", currentWasteKgs);
    updateKPI();
    alert("⚡ Trạm tái chế vận hành tốt! Đã xử lý thêm 15kg rác và cập nhật thẳng lên tổng bộ hệ thống.");
  }
}

// ĐĂNG XUẤT
function logout() {
  currentUser = null;
  // Làm mới trang để reset trạng thái ứng dụng về ban đầu mượt mà nhất
  location.reload();
}
</script>

</body>
</html>
